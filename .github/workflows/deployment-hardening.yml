name: Deployment Hardening

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deployment-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run v0.7 deployment hardening tests
        run: python -m pytest tests/test_operational_controls.py -q
      - name: Validate v0.7 schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          for name in (
              "deployment-control-profile.schema.json",
              "operational-control-evidence.schema.json",
          ):
              payload = json.loads((Path("schemas") / name).read_text(encoding="utf-8"))
              assert payload["$schema"] == "https://json-schema.org/draft/2020-12/schema"
              assert payload["additionalProperties"] is False
              jsonschema.Draft202012Validator.check_schema(payload)
          PY
      - name: Verify Kubernetes hardening reference
        run: |
          grep -q 'automountServiceAccountToken: false' deployment/kubernetes-reference.yaml
          grep -q 'runAsNonRoot: true' deployment/kubernetes-reference.yaml
          grep -q 'type: RuntimeDefault' deployment/kubernetes-reference.yaml
          grep -q 'allowPrivilegeEscalation: false' deployment/kubernetes-reference.yaml
          grep -q 'readOnlyRootFilesystem: true' deployment/kubernetes-reference.yaml
          grep -q -- '- ALL' deployment/kubernetes-reference.yaml
          grep -q '@sha256:' deployment/kubernetes-reference.yaml
          grep -q 'secretKeyRef:' deployment/kubernetes-reference.yaml
          grep -q 'kind: NetworkPolicy' deployment/kubernetes-reference.yaml
          grep -q 'egress: \[\]' deployment/kubernetes-reference.yaml
      - name: Clean-wheel operational-control smoke
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m venv /tmp/doraops-operational-wheel
          /tmp/doraops-operational-wheel/bin/python -m pip install dist/*.whl
          /tmp/doraops-operational-wheel/bin/python - <<'PY'
          from doraops.operational_controls import DeploymentControlProfile, OperationalControlEvidence
          assert DeploymentControlProfile is not None
          assert OperationalControlEvidence is not None
          PY
