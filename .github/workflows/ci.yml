name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Build wheel
        run: python -m build --wheel
      - name: Clean-wheel smoke
        shell: bash
        run: |
          python -m venv /tmp/doraops-wheel
          /tmp/doraops-wheel/bin/python -m pip install --upgrade pip
          /tmp/doraops-wheel/bin/python -m pip install dist/*.whl
          /tmp/doraops-wheel/bin/python - <<'PY'
          import doraops
          assert doraops.__version__ == "0.1.0"
          print(doraops.__version__)
          PY
          /tmp/doraops-wheel/bin/doraops --version
          printf '{"b":2,"a":1}\n' > /tmp/doraops-document.json
          /tmp/doraops-wheel/bin/doraops digest /tmp/doraops-document.json
          cat > /tmp/doraops-schema.json <<'JSON'
          {"$schema":"https://json-schema.org/draft/2020-12/schema","type":"object","required":["a"],"properties":{"a":{"type":"integer"}}}
          JSON
          /tmp/doraops-wheel/bin/doraops schema /tmp/doraops-schema.json /tmp/doraops-document.json
