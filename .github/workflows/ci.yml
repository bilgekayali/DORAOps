name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Validate all Draft 2020-12 schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          for path in sorted(Path("schemas").glob("*.schema.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload["$schema"] == "https://json-schema.org/draft/2020-12/schema"
              jsonschema.Draft202012Validator.check_schema(payload)
              print(path)
          PY
      - name: Build wheel
        run: python -m build --wheel
      - name: Clean-wheel smoke
        shell: bash
        run: |
          python -m venv /tmp/doraops-wheel
          /tmp/doraops-wheel/bin/python -m pip install --upgrade pip
          /tmp/doraops-wheel/bin/python -m pip install dist/*.whl
          /tmp/doraops-wheel/bin/python - <<'PY'
          import doraops
          from doraops import (
              DependencyImpactSnapshot,
              GovernanceDossierBuilder,
              IncidentReportingRegistry,
              ReportingApplicabilityDecision,
              ReportingWorkflowAssessment,
              RecoveryObjectiveProfile,
          )
          from doraops.assurance import (
              AssurancePolicy,
              AssuranceState,
              PortfolioAssuranceRegistry,
              PortfolioAssuranceSnapshot,
          )
          from doraops.security import IdentityPolicy, TenantContext
          assert doraops.__version__ == "0.5.0"
          assert doraops.RELEASE_VERSION == "0.5.0"
          assert RecoveryObjectiveProfile is not None
          assert GovernanceDossierBuilder is not None
          assert DependencyImpactSnapshot is not None
          assert IncidentReportingRegistry is not None
          assert ReportingApplicabilityDecision is not None
          assert ReportingWorkflowAssessment is not None
          assert AssurancePolicy is not None
          assert AssuranceState is not None
          assert PortfolioAssuranceRegistry is not None
          assert PortfolioAssuranceSnapshot is not None
          assert IdentityPolicy is not None
          assert TenantContext is not None
          assert hasattr(GovernanceDossierBuilder, "add_incident_reporting")
          print(doraops.__version__)
          PY
          /tmp/doraops-wheel/bin/doraops --version
          printf '{"b":2,"a":1}\n' > /tmp/doraops-document.json
          /tmp/doraops-wheel/bin/doraops digest /tmp/doraops-document.json
          cat > /tmp/doraops-schema.json <<'JSON'
          {"$schema":"https://json-schema.org/draft/2020-12/schema","type":"object","required":["a"],"properties":{"a":{"type":"integer"}}}
          JSON
          /tmp/doraops-wheel/bin/doraops schema /tmp/doraops-schema.json /tmp/doraops-document.json
