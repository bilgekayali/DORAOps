name: CodeQL

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
