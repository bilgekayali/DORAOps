name: Security Boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run v0.5 security-boundary tests
        run: python -m pytest tests/test_security_boundary.py
      - name: Validate PostgreSQL RLS reference
        run: |
          grep -q 'ENABLE ROW LEVEL SECURITY' deployment/postgresql-entity-rls.sql
          grep -q 'FORCE ROW LEVEL SECURITY' deployment/postgresql-entity-rls.sql
          grep -q 'NOBYPASSRLS' deployment/postgresql-entity-rls.sql
          grep -q "current_setting('doraops.entity_id', true)" deployment/postgresql-entity-rls.sql
      - name: Clean-wheel security smoke
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m venv /tmp/doraops-security-wheel
          /tmp/doraops-security-wheel/bin/python -m pip install dist/*.whl
          /tmp/doraops-security-wheel/bin/python - <<'PY'
          from doraops.security import EvidenceKeyReference, IdentityPolicy, TenantContext
          assert EvidenceKeyReference is not None
          assert IdentityPolicy is not None
          assert TenantContext is not None
          PY
